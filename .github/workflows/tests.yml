name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Redundant, covered in toml file dependencies.
      # - uses: astral-sh/ruff-action@v4.1.0
      #   with:
      #     src: "./src"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Is now under unit test just so pytest doesn't throw a hissy fit when tests/
      # is otherwise empty.
      # - name: Smoke test
      #   run: python -c "import project_package"

      - name: Run tests
        run: pytest
